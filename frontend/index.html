<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Marketing360 Foley // We Transform Every Industry and Business Process.</title>
  <script>
    // Prevent flash: apply theme class before first paint
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>

<body class="font-sora antialiased">
  <!-- Hidden static HTML form for Netlify Forms detection at build time -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="projectType">
      <option value="Web Development">Web Development</option>
      <option value="SEO">SEO</option>
      <option value="Social Media Marketing">Social Media Marketing</option>
      <option value="AI Automation">AI Automation</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
