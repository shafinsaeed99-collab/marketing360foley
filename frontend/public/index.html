<!doctype html>
<html lang="en" class="dark no-transition">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>Marketing360 Foley // We Transform Every Industry and Business Process.</title>
  <script>
    // Prevent flash & unwanted load transitions: apply theme class and keep no-transition before paint
    (function () {
      var theme = localStorage.getItem('theme');
      if (theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
      document.documentElement.classList.add('no-transition');
    })();
  </script>
</head>

<body class="font-sora antialiased">
  <!-- Hidden static HTML form for Netlify Forms detection at build time -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="projectType">
      <option value="Web Development">Web Development</option>
      <option value="SEO">SEO</option>
      <option value="Social Media Marketing">Social Media Marketing</option>
      <option value="AI Automation">AI Automation</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <form name="free-audit" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="free-audit" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="text" name="business" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    <input type="text" name="websiteOrSocial" />
    <select name="whatYouDo">
      <option value="Restaurants & Retail">Restaurants & Retail</option>
      <option value="Home Services (HVAC, Plumbing, Roofing)">Home Services (HVAC, Plumbing, Roofing)</option>
      <option value="Med Spas & Healthcare Clinics">Med Spas & Healthcare Clinics</option>
      <option value="Contractors & Realty">Contractors & Realty</option>
      <option value="Other Local Business">Other Local Business</option>
    </select>
    <select name="serviceNeeded">
      <option value="Web Development">Web Development</option>
      <option value="SEO">SEO</option>
      <option value="Social Media Marketing">Social Media Marketing</option>
      <option value="AI Automation">AI Automation</option>
      <option value="Full Package / All Services">Full Package / All Services</option>
    </select>
  </form>

  <div id="root"></div>
</body>

</html>
